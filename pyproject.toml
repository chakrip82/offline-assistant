[project]
name = "offline-assistant"
version = "0.1.0"
description = "A fully offline, local-first personal AI assistant (text + voice)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "requests>=2.31",
    "chromadb>=0.5.0",
    "rich>=13.7",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "webrtcvad>=2.0.10",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[project.scripts]
assistant = "assistant.interfaces.cli:main"
assistant-voice = "assistant.interfaces.voice_loop:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
